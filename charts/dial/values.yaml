# global values used by this chart
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  kubeVersion: ""

### Generic Kubernetes parameters ###

kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
extraDeploy: []

podSecurityContext:
  enabled: false
  fsGroup: 1001
containerSecurityContext:
  enabled: false
  runAsUser: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: false

podLabels: {}
podAnnotations: {}
podAffinityPreset: ""
podAntiAffinityPreset: soft

### Pod Disruption Budget, Autoscaling, and Node Affinity ###

pdb:
  create: false
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

nodeAffinityPreset:
  type: ""
  key: ""
  values: []

affinity: {}
nodeSelector: {}
tolerations: []
updateStrategy:
  type: RollingUpdate
priorityClassName: ""
topologySpreadConstraints: []
schedulerName: ""
terminationGracePeriodSeconds: ""
lifecycleHooks: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumeMounts: []
# extraVolumes/dial.extraVolumeMounts: wire up the shared filesystem for "dial.base_directory".
#
# DIAL stores each workflow's pickled model and raw dataset (TSV) on disk under
# "dial.base_directory" instead of in MongoDB (MongoDB's 16MB per-document BSON limit
# is easy to hit with a growing model or dataset). Because "replicaCount"/"autoscaling"
# below allow this Deployment to run more than one Pod, that directory MUST be backed by
# a volume that supports the ReadWriteMany (RWX) access mode - every replica needs to see
# every workflow's files, regardless of which replica originally wrote them. A default
# storage class backed by AWS EBS, GCE PD, Azure Disk, or local hostPath does NOT support
# RWX (those are ReadWriteOnce-only); you need an RWX-capable storage class, e.g. one
# backed by NFS, AWS EFS, Azure Files, or CephFS. Confirm with whoever manages the target
# cluster before deploying with more than one replica.
#
# WARNING - the default (replicaCount: 1, autoscaling.enabled: false) does NOT mount
# any volume at "dial.base_directory" - it falls back to the container's own ephemeral
# filesystem, so all stored models/datasets are LOST on every pod restart. That's fine
# for a quick single-pod smoke test, but wire up the RWX PVC below before running for
# real or before enabling autoscaling/increasing replicaCount.
#
# Example: provision an RWX PVC (adjust storageClassName to whatever RWX class your
# cluster provides) and mount it at the same path referenced by "dial.base_directory" in
# dial.configFile below (e.g. "/app/dial-data"):
#
#   extraVolumes:
#     - name: dial-data
#       persistentVolumeClaim:
#         claimName: dial-data-rwx  # create this PVC separately, with accessModes: [ReadWriteMany]
#   dial:
#     extraVolumeMounts:
#       - name: dial-data
#         mountPath: /app/dial-data
#
# See charts/dial/README.md for a full PVC manifest example and further discussion.
extraVolumes: []
initContainers: []
sidecars: []

### Replica Count ###

replicaCount: 1

### Dial Service Configuration ###

dial:
  ### container image - uses GitHub Container Registry
  image:
    registry: ghcr.io
    repository: "intersect-dial/dial"
    tag: "latest"
    digest: ""
    pullPolicy: ""
    pullSecrets: []

  ### Configuration file (local-conf.json)
  ### This will be mounted at /app/local-conf.json
  configFile: |
    {
      "intersect": {
        "brokers": [
          {
            "username": "intersect_username",
            "password": "intersect_password",
            "host": "broker",
            "port": 5672,
            "protocol": "amqp0.9.1"
          }
        ]
      },
      "intersect-hierarchy": {
        "organization": "intersect",
        "facility": "default",
        "system": "dial-system",
        "subsystem": "dial-subsystem",
        "service": "dial-service"
      },
      "dial": {
        "mongo": {
          "username": "dial",
          "password": "changeme",
          "host": "dial-mongodb",
          "port": 27017
        },
        "base_directory": "/app/dial-data"
      }
    }

  ### Provide an existing secret with key (local-conf.json)
  ### NOTE: when this option is applied, the chart does not create the secret
  configFileExistingSecret: ""

  diagnosticMode:
    enabled: false
    command:
      - sleep
    args:
      - infinity

  extraContainerPorts: []

  resources:
    limits: {}
    requests: {}

  command: []
  args: []
  hostAliases: []

  ### Environment variables for Dial service
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""

### Service Account Configuration ###

serviceAccount:
  create: false
  annotations: {}
  name: ""
  automountServiceAccountToken: true

### MongoDB Subchart Configuration ###
### See: https://github.com/bitnami/charts/tree/main/bitnami/mongodb

mongodb:
  enabled: true
  auth:
    enabled: true
    username: dial
    password: "changeme"
    rootPassword: "changeme"
    database: dial
  service:
    port: 27017
  persistence:
    enabled: true
    size: 8Gi
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: "7.0"

### External MongoDB Configuration (used if mongodb.enabled is false) ###

externalMongoDB:
  enabled: false
  connectionString: "mongodb://user:password@mongodb-host:27017/dial?authSource=admin"

### INTERSECT Configuration for Dial ###

intersectConfig:
  brokers: []
  hierarchy:
    organization: "intersect"
    facility: "default"
    system: "dial"
    subsystem: "service"
    service: "dial"
